<main><div class="wrap"><div class="hero reveal"><div><div class="eyebrow"><span class="dot"></span><span data-tr="ANKARA MERKEZLİ · ULUSLARARASI DENEYİM" data-en="BASED IN ANKARA · INTERNATIONAL EXPERIENCE"></span></div><h1 data-tr="Tasarımdan<br><em>uygulamaya.</em>" data-en="From design<br><em>to realization.</em>"></h1><p class="intro" data-tr="Ben Songül Aydın. Mimarlık, ince işler ve şantiye koordinasyonu alanlarında, farklı coğrafyalarda edinilmiş bir deneyimi bir araya getiriyorum." data-en="I’m Songül Aydın. An architect bringing together experience in architectural design, finishing works and site coordination across different geographies."></p><div class="actions"><a class="textlink arrow-up-right" href="#projects"><span data-tr="Projeleri keşfet" data-en="Explore projects"></span></a><a class="textlink" href="songul-aydin-cv.pdf" data-action="cv" target="_blank" rel="noopener" download data-tr="CV’yi indir ↓" data-en="Download CV ↓"></a></div></div><figure class="portrait"><img src="songul-aydin-enhanced.jpg" alt="Songül Aydın şantiyede / Songül Aydın on site"><figcaption><b>Songül Aydın</b><span data-tr="Mimar · İnce İşler Şefi / Yöneticisi" data-en="Architect · Finishing Works Site Chief / Manager"></span></figcaption></figure></div>
<div class="facts"><div><strong>2000</strong><span data-tr="Mimarlık kariyerinin başlangıcı" data-en="Beginning of architectural career"></span></div><div><strong>6</strong><span data-tr="Ülkede proje deneyimi" data-en="Countries of project experience"></span></div><div><strong data-tr="Ölçekler arası" data-en="Across scales"></strong><span data-tr="Sağlık · Ulaşım · Kültür · Konut" data-en="Healthcare · Transport · Culture · Residential"></span></div></div>
<section id="about" class="about"><div><div class="eyebrow">01 / <span data-tr="HAKKIMDA" data-en="ABOUT"></span></div><h2 style="margin-top:22px" data-tr="Detayda titizlik.<br>Sahada bütünlük." data-en="Precision in detail.<br>Coherence on site."></h2></div><div><p data-tr="Mimarlık eğitimim ve üstyapı projelerinde edindiğim 25 yıllık deneyimimle, ince işler alanında uzmanlaşmış bir ince işler şefiyim. Havalimanı, otel, stadyum ve hastane gibi üstyapı projelerinde çalışarak kalite kontrolü, teknik detaylandırma, saha koordinasyonu ve iş ilerleme takibi konularında güçlü bir uzmanlık geliştirdim. Disiplinli, çözüm ve sonuç odaklı yaklaşımımla projelerin başarıyla tamamlanmasına katkı sağlıyorum. Eylemlerin ve sonuçların sözlerden daha güçlü olduğuna inanıyorum." data-en="With a background in architecture and 25 years of experience in building construction projects, I am a site chief specializing in finishing works. Working on airports, hotels, stadiums and hospitals has enabled me to develop strong expertise in quality control, technical detailing, site coordination and progress monitoring. With a disciplined, solution-oriented and results-driven approach, I contribute to the successful completion of projects. I believe that actions and results speak louder than words."></p><div class="skills"><span data-tr="İnce işler yönetimi" data-en="Finishing works management"></span><span data-tr="Şantiye koordinasyonu" data-en="Site coordination"></span><span data-tr="Mimari tasarım" data-en="Architectural design"></span><span>AutoCAD</span><span>Photoshop</span><span>MS Office</span></div></div></section>
<section id="projects"><div class="sectiontop"><h2 data-tr="Seçili proje deneyimleri" data-en="Selected project experience"></h2><span class="eyebrow">02 / <span data-tr="PORTFOLYO" data-en="PORTFOLIO"></span></span></div><p class="sectionnote" data-tr="Görev aldığım projelerden bir seçki. Belirtilen roller şantiye ve ince işler kapsamındadır." data-en="A selection of projects I contributed to. Listed roles relate to site coordination and finishing works."></p><div class="projects" id="projectlist"></div></section>
<section id="experience" class="experience"><div><div class="eyebrow">03 / <span data-tr="KARİYER" data-en="CAREER"></span></div><h2 style="margin-top:22px" data-tr="Sahada geçen<br>bir yolculuk." data-en="A journey<br>shaped on site."></h2><p style="color:var(--muted);font-size:13px" data-tr="2000 yılından bu yana tasarım ofislerinden uluslararası şantiyelere." data-en="From design offices to international construction sites, since 2000."></p></div><div id="jobs"></div></section>
